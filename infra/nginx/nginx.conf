events {}

http {
  # WebSocket upgrade support
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Rate limiting (T087). The login rate must tolerate a venue full of guests behind
  # one NAT IP — targeted brute-force protection is the app-level failure lockout in
  # backend/src/services/login_throttle.py (429 after repeated wrong passwords).
  limit_req_zone $binary_remote_addr zone=login:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

  # Redirect HTTP → HTTPS
  server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    client_max_body_size 550m;  # allow large video uploads (proxied paths)

    # FR-037: never index this event. Set at the server level so it also covers media
    # objects and API responses, which carry no HTML <meta> tag of their own.
    add_header X-Robots-Tag "noindex, nofollow, noimageindex" always;

    # Login is rate-limited hardest (brute-force protection).
    location = /api/v1/auth/login {
      limit_req zone=login burst=60 nodelay;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API
    location /api/ {
      limit_req zone=api burst=60 nodelay;
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket. Don't log — the access token rides in the query string and must not
    # land in access logs (T087).
    location /ws {
      access_log off;
      proxy_pass http://backend:8000;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
    }

    # Media objects: served by the backend at app-root (NOT under /api/v1 — the spec
    # keeps the path CDN-shaped, matching NEXT_PUBLIC_MEDIA_BASE). The backend only
    # answers with a cheap 307 to a presigned OSS URL in prod, so no rate limit here —
    # a gallery page easily fans out dozens of thumbnail requests from one client.
    location /media-object/ {
      proxy_pass http://backend:8000;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend (Next.js)
    location / {
      proxy_pass http://frontend:3000;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
